name: Tests

on:
  workflow_call:
    inputs:
      slice_count:
        description: Number of parallel Python test slices
        type: number
        default: 8
      e2e_mode:
        description: Run the short PR smoke checks or the complete E2E suite
        type: string
        default: smoke
      run_unit:
        description: Run the unit-test matrix
        type: boolean
        default: true

permissions:
  contents: read

# Cancel in-progress runs for the same ref
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate test slices
    runs-on: arc-runner-small
    if: inputs.run_unit
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate test matrix
        id: matrix
        run: |
          matrix="$(python3 scripts/run_tests_parallel.py --generate-slices '${{ inputs.slice_count }}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    name: Run tests slice ${{ matrix.slice.index }}/${{ inputs.slice_count }}
    needs: generate
    if: inputs.run_unit
    # Use NousResearch's shared ARC pool and balanced unit-test slices.
    runs-on: arc-runner-set
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate.outputs.matrix) }}
    timeout-minutes: ${{ github.repository == 'NousResearch/hermes-agent' && 30 || 60 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          # Pin the uv version: unpinned, setup-uv resolves "latest" by
          # fetching a manifest from raw.githubusercontent.com on EVERY job —
          # a transient fetch failure fails the whole job (2026-07-28 slice-5
          # incident). Pinned, the binary downloads directly; no manifest hop.
          #
          # The uv pin also fixes which CPython `uv python install 3.11`
          # resolves, and with it the linked SQLite. uv 0.9.28 resolved
          # 3.11.14 / SQLite 3.50.4, which has the WAL-reset bug, so Hermes
          # ran every state.db in DELETE mode here and the WAL path went
          # untested. 0.12.13 resolves 3.11.16 / SQLite 3.53.1. The
          # "Check SQLite runs WAL" step fails the job if a bump regresses it.
          version: "0.12.13"
          # Persist uv's download/wheel cache (~/.cache/uv) across runs.
          # Keyed on the dependency manifests, so the cache is reused until
          # pyproject.toml or uv.lock changes. `uv sync` still runs every
          # time, but resolves from the warm cache instead of re-downloading
          # and re-building wheels.
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install dependencies
        # `uv sync --locked` installs the exact pinned set from uv.lock (and
        # fails if the lock is out of sync with pyproject.toml), giving a
        # reproducible env. It also creates .venv itself, so no separate
        # `uv venv` step is needed.
        #
        # The trailing extras beyond all/dev are the lazy-install features
        # (tools/lazy_deps.py) that tests exercise for real: provider.anthropic,
        # stt/tts.mistral, image.fal, terminal.modal, terminal.daytona,
        # search.parallel, provider.bedrock. The hermetic test env forbids
        # mid-run pip installs (HERMES_DISABLE_LAZY_INSTALLS=1 in
        # tests/conftest.py), so the SDKs those tests need must be in the
        # venv up front — resolved from uv.lock like everything else, which
        # also honors the exact supply-chain pins these extras carry.
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra parallel-web --extra bedrock

      - name: Minimize uv cache
        # Optimized for CI: prunes pre-built wheels that are cheap to
        # re-download, keeping the persisted cache small and fast to restore.
        run: uv cache prune --ci

      - name: Check SQLite runs WAL
        # Hermes picks DELETE journal mode on a SQLite with the WAL-reset
        # bug. If this interpreter links one, every WAL test silently runs
        # DELETE (or skips), so fail loudly instead. Tests that need DELETE
        # select it explicitly (journal_mode config, a pinned vulnerable
        # version), so they run on any interpreter.
        run: |
          .venv/bin/python -c "import sqlite3, sys, hermes_state_wal as w; v = w.is_sqlite_wal_reset_vulnerable(); print(f'Python {sys.version.split()[0]}, SQLite {sqlite3.sqlite_version}, WAL-reset vulnerable: {v}'); sys.exit(1 if v else 0)"

      - name: Restore per-file duration cache
        # scripts/run_tests_parallel.py raises a file's timeout to
        # 3x its last healthy duration (_effective_file_timeout) so a
        # known-slow file dilated by load is not SIGKILL'd at the flat cap
        # and laundered into a FLAKY retry. The scaler reads
        # test_durations.json from the checkout; without this restore the
        # file is absent on a fresh runner and the scaler is inert.
        # Exact key never matches (run_id differs); restore-keys picks the
        # most recent cache saved by a main push. PRs read, only main writes.
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations.json
          key: test-durations-never-exact
          restore-keys: |
            test-durations-

      - name: Run tests
        # Per-file isolation via scripts/run_tests.sh: each test file runs
        # in its own freshly-spawned `python -m pytest <file>` subprocess
        # with bounded parallelism. No xdist, no shared workers, no
        # module-level state leakage between files.
        #
        run: |
          source .venv/bin/activate
          scripts/run_tests.sh --files '${{ matrix.slice.files }}'
        env:
          # A cold-cache compression file can exceed 300s under heavy load.
          HERMES_TEST_FILE_TIMEOUT: 600
          # Ensure tests don't accidentally call real APIs
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

      - name: Save per-file duration cache (main only)
        # Only green first-attempt durations are written by the runner, so
        # a hang on main cannot ratchet its own bound upward.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('test_durations.json') != ''
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations.json
          key: test-durations-${{ github.run_id }}

  e2e:
    # Use the shared ARC pool for the fast PR smoke and full E2E suite.
    runs-on: arc-runner-set
    strategy:
      fail-fast: false
      matrix:
        shard: [0]
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        # The boot-contract suite feeds serve's stdout through Desktop's own
        # backend-ready.ts (native TS stripping needs Node >= 22.18).
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26

      - name: Install Node deps and build the Ink TUI
        if: inputs.e2e_mode == 'full' && matrix.shard == 0
        # tests/e2e/core/terminal drives the real `hermes --tui` over a PTY;
        # HERMES_E2E_REQUIRE_TUI=1 below turns a missing build into a failure.
        uses: ./.github/actions/retry
        with:
          command: npm ci --workspace ui-tui --ignore-scripts --no-audit --no-fund && npm run build --workspace ui-tui

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          # Pin the uv version: unpinned, setup-uv resolves "latest" by
          # fetching a manifest from raw.githubusercontent.com on EVERY job —
          # a transient fetch failure fails the whole job (2026-07-28 slice-5
          # incident). Pinned, the binary downloads directly; no manifest hop.
          # Newer than the unit job's pin on purpose: 0.9.28 only knows CPython
          # 3.11.14, whose bundled SQLite has the WAL-reset bug, so Hermes runs
          # state.db in DELETE mode and the WAL torture chamber would skip.
          version: "0.12.13"
          # Persist uv's download/wheel cache (~/.cache/uv) across runs.
          # Keyed on the dependency manifests, so the cache is reused until
          # pyproject.toml or uv.lock changes. `uv sync` still runs every
          # time, but resolves from the warm cache instead of re-downloading
          # and re-building wheels.
          enable-cache: true
          # Own cache entry: the unit job's older uv would otherwise share and
          # overwrite this key with a cache this uv version did not write.
          cache-suffix: e2e
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11.15

      - name: Install dependencies
        # `uv sync --locked` installs the exact pinned set from uv.lock (and
        # fails if the lock is out of sync with pyproject.toml), giving a
        # reproducible env. It also creates .venv itself, so no separate
        # `uv venv` step is needed.
        #
        # Same extras as the test job's sync above: the hermetic test env
        # forbids mid-run pip installs (HERMES_DISABLE_LAZY_INSTALLS=1 in
        # tests/conftest.py), so lazy-install SDKs exercised by tests must be
        # in the venv up front.
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11.15 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra parallel-web --extra bedrock

      - name: Minimize uv cache
        # Optimized for CI: prunes pre-built wheels that are cheap to
        # re-download, keeping the persisted cache small and fast to restore.
        run: uv cache prune --ci

      - name: Require a WAL-capable SQLite
        # The state.db suites skip on a WAL-reset-vulnerable SQLite; fail
        # instead of reporting green over zero coverage.
        run: |
          source .venv/bin/activate
          python -c "import sqlite3, hermes_state_wal as w; print('sqlite', sqlite3.sqlite_version); assert not w.is_sqlite_wal_reset_vulnerable()"

      - name: Restore per-file duration cache
        # Keep E2E timing history per shard so every runner can balance from
        # its own measured durations rather than whichever cache wrote last.
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations.json
          key: test-durations-e2e-${{ matrix.shard }}-never-exact
          restore-keys: |
            test-durations-e2e-${{ matrix.shard }}-

      - name: Run e2e tests
        # One subprocess per file, in parallel: the core suites spawn real
        # processes (serve, gateway, tui_gateway, MCP servers, SQLite writers)
        # and must not share interpreter state.
        # tests/e2e/core/upgrade runs in its own job (e2e-upgrade) below.
        run: |
          source .venv/bin/activate
          if [[ '${{ inputs.e2e_mode }}' == 'smoke' ]]; then
            files=(
              tests/e2e/core/parity/test_boot_contract.py
              tests/e2e/core/providers/test_anthropic_discovery_and_aliases.py
              tests/e2e/core/security/test_secret_redaction.py
            )
          else
            mapfile -t files < <(python3 - <<'PY'
          import json
          from pathlib import Path

          all_files = sorted(p.as_posix() for p in Path("tests/e2e").rglob("test_*.py")
                             if "tests/e2e/core/upgrade/" not in p.as_posix())
          tui_files = [p for p in all_files if p in {
              "tests/e2e/core/security/test_attach_handshake.py",
              "tests/e2e/core/dashboard/test_dashboard_pty.py",
              "tests/e2e/core/terminal/test_terminal_transcript_pty.py",
          }]
          files = [p for p in all_files if p not in tui_files]
          try:
              durations = json.loads(Path("test_durations.json").read_text())
          except (OSError, json.JSONDecodeError):
              durations = {}
          # The first run on a new runner may not have E2E timings cached.
          # Seed the heaviest files from the last hosted run, then replace
          # these estimates with measured durations as the cache fills in.
          known_slow = {
              "tests/e2e/core/delivery/test_messaging_exactly_once.py": 321,
              "tests/e2e/core/history/test_prefix_stability.py": 254,
              "tests/e2e/core/delivery/test_cron_virtual_clock_soak.py": 154,
              "tests/e2e/core/history/test_transcript_ledger.py": 139,
              "tests/e2e/core/providers/test_anthropic_errors.py": 132,
              "tests/e2e/core/sqlite/test_compaction_contention.py": 124,
              "tests/e2e/core/compaction/test_compaction_manual.py": 123,
          }
          durations = {path: max(durations.get(path, 15), known_slow.get(path, 0)) for path in files}
          import os
          shard_count = int(os.environ["E2E_SHARD_COUNT"])
          bins = [([], 0.0) for _ in range(shard_count)]
          for path in sorted(files, key=lambda p: durations.get(p, 1.0), reverse=True):
              bucket = min(range(shard_count), key=lambda i: bins[i][1])
              bins[bucket][0].append(path)
              bins[bucket] = (bins[bucket][0], bins[bucket][1] + durations.get(path, 1.0))
          shard = int(os.environ["E2E_SHARD"])
          if shard == 0:
              # These suites launch the built Ink TUI; keep them with shard 0's build.
              bins[shard][0].extend(tui_files)
          print("\n".join(sorted(bins[shard][0])))
          PY
            )
            echo "Shard ${{ matrix.shard }}: ${#files[@]} E2E files"
          fi
          scripts/run_tests.sh --include-integration "${files[@]}"
        env:
          E2E_SHARD: ${{ matrix.shard }}
          E2E_SHARD_COUNT: "1"
          # Multi-process episodes (torture chamber, compaction kill -9,
          # gateway liveness, delivery exactly-once through a real gateway,
          # the cron virtual-clock soak) legitimately run past the 300 s default.
          HERMES_TEST_FILE_TIMEOUT: "900"
          # No automatic re-run of a failed file: the torture chamber and the
          # exactly-once/compaction suites are race detectors, and a rare
          # corruption that passes on retry is still a corruption.
          HERMES_TEST_FILE_RETRIES: "0"
          # Each E2E file is a process tree; cap concurrent trees at the
          # empirically stable three on both hosted-runner configurations.
          HERMES_TEST_WORKERS: 3
          HERMES_E2E_REQUIRE_TUI: "1"
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

      - name: Save per-file duration cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('test_durations.json') != ''
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations.json
          key: test-durations-e2e-${{ matrix.shard }}-${{ github.run_id }}

  e2e-upgrade:
    # tests/e2e/core/upgrade: a real N-1 -> HEAD `hermes update` (clean,
    # autostash, killed mid-pull / mid-deps, offline), fresh-process import and
    # entrypoint smoke, and the config round-trip property matrix. Its own job:
    # it needs full history + tags, bubblewrap, and one file runs ~5-15 min.
    # Use the shared ARC pool for the process-heavy update suite.
    runs-on: arc-runner-set
    if: inputs.e2e_mode == 'full'
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Keep all commit ancestry and release tags for N-1 and the historical
          # updater scenario, but defer unrelated historical file contents.
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none

      - name: Fetch official release tags
        # Forks may not carry the newest upstream release tag. The upgrade
        # base and historical updater scenario are defined by NousResearch tags.
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --filter=blob:none --no-recurse-submodules upstream '+refs/tags/v20*:refs/tags/v20*'

      - name: Set up Node
        # `hermes update` builds the web UI / TUI workspaces.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Prepare shared Node dependencies for updater legs
        run: |
          echo "HERMES_E2E_NODE_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
          npm ci --workspace ui-tui --workspace web --include-workspace-root --no-audit --no-fund

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          # Pin the uv version: unpinned, setup-uv resolves "latest" by
          # fetching a manifest from raw.githubusercontent.com on EVERY job —
          # a transient fetch failure fails the whole job (2026-07-28 slice-5
          # incident). Pinned, the binary downloads directly; no manifest hop.
          # Newer than the unit job's pin on purpose: 0.9.28 only knows CPython
          # 3.11.14, whose bundled SQLite has the WAL-reset bug, so Hermes runs
          # state.db in DELETE mode and the WAL torture chamber would skip.
          version: "0.12.13"
          # Persist uv's download/wheel cache (~/.cache/uv) across runs.
          # Keyed on the dependency manifests, so the cache is reused until
          # pyproject.toml or uv.lock changes. `uv sync` still runs every
          # time, but resolves from the warm cache instead of re-downloading
          # and re-building wheels.
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11.15

      - name: Install dependencies
        # `uv sync --locked` installs the exact pinned set from uv.lock (and
        # fails if the lock is out of sync with pyproject.toml), giving a
        # reproducible env. It also creates .venv itself, so no separate
        # `uv venv` step is needed.
        #
        # Same extras as the test job's sync above: the hermetic test env
        # forbids mid-run pip installs (HERMES_DISABLE_LAZY_INSTALLS=1 in
        # tests/conftest.py), so lazy-install SDKs exercised by tests must be
        # in the venv up front.
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11.15 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra parallel-web

      - name: Verify and hydrate upgrade release snapshots
        # The real upgrade clone uses --shared from this checkout. Materialize
        # the exact N-1 and pre-handoff snapshots first, so its offline local
        # origin has every blob those full-tree scenarios need.
        run: |
          source .venv/bin/activate
          python - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          from tests.e2e.core.upgrade.test_upgrade_path import _refs
          from tests.e2e.core.upgrade.test_fresh_process_entrypoints import _pre_handoff_tag

          refs = _refs()
          assert refs.base_tag, "N-1 release tag is not reachable from HEAD"

          def hydrate(tag: str, *paths: str) -> None:
              archive = subprocess.Popen(
                  ["git", "archive", "--format=tar", tag, "--", *paths],
                  stdout=subprocess.PIPE,
              )
              assert archive.stdout is not None
              listing = subprocess.run(["tar", "-tf", "-"], stdin=archive.stdout, stdout=subprocess.DEVNULL)
              archive.stdout.close()
              assert archive.wait() == 0 and listing.returncode == 0, f"could not hydrate {tag}"

          release_tags = subprocess.run(
              ["git", "tag", "--merged", "HEAD", "--sort=-v:refname", "--list", "v20*"],
              capture_output=True, text=True, check=True,
          ).stdout.splitlines()[:15]
          pre_handoff = None
          for tag in release_tags:
              # The discovery helper reads these files; materialize them one
              # candidate at a time in this blob-filtered checkout.
              hydrate(tag, "hermes_cli")
              pre_handoff = _pre_handoff_tag()
              if pre_handoff is not None:
                  break
          assert pre_handoff is not None, "pre-handoff release tag is not reachable from HEAD"

          hydrate(refs.base_tag)
          config = tomllib.loads(Path("pyproject.toml").read_text())
          package_tops = {
              entry.split(".", 1)[0]
              for entry in config["tool"]["setuptools"]["packages"]["find"]["include"]
          }
          old_entries = subprocess.run(
              ["git", "ls-tree", "--name-only", pre_handoff[0]],
              capture_output=True, text=True, check=True,
          ).stdout.splitlines()
          old_entries = [name for name in old_entries if name.endswith(".py") or name in package_tops]
          hydrate(pre_handoff[0], *old_entries)
          print(f"Hydrated upgrade bases: {refs.base_tag}, {pre_handoff[0]}")
          PY

      - name: Install bubblewrap
        # Every spawned updater runs in bwrap (own PID namespace, no user
        # systemd bus, only the test tmp writable). Ubuntu 24.04 restricts
        # unprivileged user namespaces, which bwrap needs.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # The suite's own probe (_bwrap_usable, same flags as every sandboxed
          # run): without it the suite silently runs the updater unsandboxed.
          source .venv/bin/activate
          python -c "from tests.e2e.core.upgrade._helpers import BWRAP_OK; assert BWRAP_OK, 'bwrap unusable'" && echo "bwrap ok"

      - name: Require a WAL-capable SQLite
        # The state.db suites skip on a WAL-reset-vulnerable SQLite; fail
        # instead of reporting green over zero coverage.
        run: |
          source .venv/bin/activate
          python -c "import sqlite3, hermes_state_wal as w; print('sqlite', sqlite3.sqlite_version); assert not w.is_sqlite_wal_reset_vulnerable()"

      - name: Run upgrade e2e tests
        run: |
          source .venv/bin/activate
          scripts/run_tests.sh --include-integration tests/e2e/core/upgrade
        env:
          HERMES_TEST_WORKERS: 4
          HERMES_TEST_FILE_TIMEOUT: "3000"
          # Each file contains deterministic, destructive-in-a-sandbox update scenarios; retrying
          # the whole file after a failure repeats several full installs without adding evidence.
          HERMES_TEST_FILE_RETRIES: "0"
          HERMES_E2E_SEED_NODE_MODULES: "1"
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
