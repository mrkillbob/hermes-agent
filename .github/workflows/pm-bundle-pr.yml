name: PM Bundle PR

# PR-only entry. Release/push/manual callers keep the original workflow unchanged.
on:
  pull_request:
    paths:
      - 'pm/**'
      - '!pm/**/*.md'
      - 'scripts/bundles/**'
      - 'scripts/ci/desktop_build_cache.py'
      - '.github/actions/desktop-build-cache/**'
      - 'scripts/windows-build-deps.ps1'
      - 'scripts/build/windows-deps.ps1'
      - '.github/actions/setup-windows-build-deps/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - '.github/workflows/pm-bundle.yml'
      - '.github/workflows/pm-bundle-pr.yml'

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  # Metadata only. No PR source/actions are fetched before admission succeeds.
  # Outside this fork's PR policy every step is a no-op, preserving caller behavior.
  review-admission:
    name: Review admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Check out trusted default-branch evaluator
        if: github.repository == 'mrkillbob/hermes-agent' && github.event_name == 'pull_request'
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: false
      - name: Evaluate current full-head Code and Security review
        if: github.repository == 'mrkillbob/hermes-agent' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_REPO: ${{ github.repository }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 -m scripts.ci.review_admission --repo "$REVIEW_REPO" --pr "$REVIEW_PR" --head "$REVIEW_HEAD"

  checks:
    name: PR checks
    needs: review-admission
    if: needs.review-admission.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/pm-bundle.yml
