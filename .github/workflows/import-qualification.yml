name: Bounded import graph qualification
true:
  push:
    branches:
    - codex/import-qualification-222
permissions:
  contents: read
jobs:
  compare:
    name: matched version resolver profile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        ref: 7b10bfd915a1cbc714ff02e5e28421d531757b7c
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false
    - name: Fetch the same official release tags as upgrade CI
      run: 'git remote add upstream https://github.com/NousResearch/hermes-agent.git

        git fetch --no-recurse-submodules upstream ''+refs/tags/v20*:refs/tags/v20*''

        '
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      with:
        version: 0.12.13
        enable-cache: true
        cache-dependency-glob: 'pyproject.toml

          uv.lock

          '
    - name: Install identical locked upgrade CI dependencies
      run: 'uv python install 3.14

        uv sync --locked --python 3.14 --extra all --group dev --extra anthropic --extra
        mistral --extra fal --extra modal --extra daytona --extra parallel-web

        '
    - name: Profile both exact source resolvers on the same VM
      run: "set -euo pipefail\nmkdir qualification\ngit worktree add --detach \"$RUNNER_TEMP/import-base\"\
        \ 14aeadc9ebb7665d6c3cfa49d17dbb31f96e64f1\ncat > \"$RUNNER_TEMP/version-profile.py\"\
        \ <<'PYPROFILE'\nimport importlib, json, statistics, sys, time\nfrom pathlib\
        \ import Path\nrepo=Path(sys.argv[1]);sys.path.insert(0,str(repo))\nv=importlib.import_module('hermes_cli.version_info')\n\
        stats={};original=v._run_git\n\ndef timed(*args):\n    started=time.monotonic();value=original(*args)\n\
        \    key=' '.join(args[1:])\n    entry=stats.setdefault(key,{'seconds':[],'result':None})\n\
        \    entry['seconds'].append(time.monotonic()-started)\n    entry['result']=value[:800]\
        \ if value else value\n    return value\nv._run_git=timed\nelapsed=[]\nfor\
        \ iteration in range(12):\n    started=time.monotonic();info=v._git_version_info(repo);elapsed.append(time.monotonic()-started)\n\
        print(json.dumps({'source':str(repo),'base_version':info.base_version,'derived_version':info.derived_version,'wall_seconds':elapsed,'median_seconds':statistics.median(elapsed),'commands':{key:{'count':len(item['seconds']),'median_seconds':statistics.median(item['seconds']),'sum_seconds':sum(item['seconds']),'result':item['result']}\
        \ for key,item in stats.items()}},indent=2))\nPYPROFILE\nCPUS=$(.venv/bin/python\
        \ -c 'import os; print(\",\".join(map(str, sorted(os.sched_getaffinity(0))[:2])))')\n\
        for case in base repair; do\n  tree=\"$PWD\"\n  if [ \"$case\" = base ]; then\
        \ tree=\"$RUNNER_TEMP/import-base\"; fi\n  taskset -c \"$CPUS\" .venv/bin/python\
        \ -I \"$RUNNER_TEMP/version-profile.py\" \"$tree\" | tee \"qualification/version-$case.json\"\
        \ndone\n"
    - name: Preserve comparison evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: matched-version-profile
        path: qualification/
        retention-days: 7
