name: Windows bundle SDK
# The desktop signing adapter downloads and executes the pinned Windows SDK
# tools. The vitest halves under js-tests run on Linux and skip every
# runIf(win32) leg, so this is the only lane that runs the real downloader.
on:
  pull_request:
    paths:
      - 'apps/desktop/scripts/windows-bundle-tools.mjs'
      - 'apps/desktop/scripts/windows-bundle-tools.test.mjs'
      - 'scripts/msix-shared.mjs'
      - 'apps/desktop/scripts/msix-shared.test.mjs'
      - 'apps/desktop/scripts/sign-msix.mjs'
      - 'apps/desktop/scripts/sign-msix.test.mjs'
      - 'apps/desktop/scripts/batch-sign-binaries.mjs'
      - 'apps/desktop/scripts/batch-sign-binaries.test.mjs'
      - '.github/workflows/windows-bundle-sdk.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-bundle-sdk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Metadata only. No PR source/actions are fetched before admission succeeds.
  # Outside this fork's PR policy every step is a no-op, preserving caller behavior.
  review-admission:
    name: Review admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Check out trusted default-branch evaluator
        if: github.repository == 'mrkillbob/hermes-agent' && github.event_name == 'pull_request'
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: false
      - name: Evaluate current full-head Code and Security review
        if: github.repository == 'mrkillbob/hermes-agent' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_REPO: ${{ github.repository }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 -m scripts.ci.review_admission --repo "$REVIEW_REPO" --pr "$REVIEW_PR" --head "$REVIEW_HEAD"

  windows-bundle-tools:
    needs: [review-admission]
    if: ${{ needs.review-admission.result == 'success' }}
    name: Cold Windows SDK (ARM64, run ${{ matrix.attempt }})
    # The 32-core ARM runner belongs to the upstream organization. The public
    # fork uses GitHub-hosted standard ARM64 runners instead of queueing forever
    # for a runner that is not available to this repository.
    runs-on: ${{ github.repository == 'NousResearch/hermes-agent' && matrix.runner || 'windows-11-arm' }}
    # Cold ARM64 npm extraction alone can exceed 15 minutes on the hosted runner.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
        runner: [windows-latest-32-arm-core]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          cache: false
          cache-python: false
          cache-node: false
      - name: Install the locked bundle tooling without native postinstalls
        run: npm ci --workspace apps/desktop --workspace tests-js --include-workspace-root --include=dev --ignore-scripts --no-audit --no-fund
      - name: Provision from an empty cache and execute the SDK
        working-directory: apps/desktop
        run: node ../../node_modules/vitest/vitest.mjs run --project electron scripts/windows-bundle-tools.test.mjs scripts/msix-shared.test.mjs scripts/sign-msix.test.mjs scripts/batch-sign-binaries.test.mjs
