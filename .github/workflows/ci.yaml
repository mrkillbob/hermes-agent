name: CI421 focused FIFO reproduction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fifo:
    name: Exact ${{ matrix.case }} FIFO reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: base-bb136
            commit: bb1361898487224024e6ad989f3e734cce930c82
          - case: candidate-f6ed
            commit: f6ed416559fc4452d98f643a82c13c2e78be986e
    steps:
      - name: Checkout exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - name: Set up locked Python and isolated test dependencies
        uses: ./.github/actions/setup-pm
        with:
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain"]'
          test-environment: 'true'
          save-tools-cache: 'false'
          save-python-cache: 'false'
          prune-python-cache: true
      - name: Verify fixture identity and add bounded synthetic diagnostics
        env:
          EXPECTED_SOURCE: ${{ matrix.commit }}
        run: |
          "$HERMES_PYTHON" -B - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import subprocess

          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['EXPECTED_SOURCE']
          path = Path('tests/gateway/test_journey_compress_restart_fifo.py')
          data = path.read_bytes()
          blob = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert blob == '8a36865de19b36f30a1901e23020751d89c99d67', blob
          needle = "            before['compacted'] = transcript(before['child'])"
          diagnostic = '''
                      print('FIFO_PRECONDITION', json.dumps({
                          'compacting_input': compacting['input_id'],
                          'child_pressure_markers': [f'PRESSURE_{i}' for i in range(12) if any(
                              str(c).startswith(f'PRESSURE_{i} ') for _, role, c in before['compacted'] if role == 'user')],
                          'child_roles_and_sizes': [(role, len(str(c))) for _, role, c in before['compacted']],
                          'summary_calls': sum(r['model'] == 'summary' for r in peer.requests),
                          'summary_input_pressure_markers': [f'PRESSURE_{i}' for i in range(12) if any(
                              f'PRESSURE_{i} ' in r['wire'] for r in peer.requests if r['model'] == 'summary')],
                      }, sort_keys=True), flush=True)
          '''
          # Only diagnostics change; the failing retention assertion stays byte-identical.
          import textwrap
          source = data.decode()
          assert source.count(needle) == 1
          source = source.replace(needle, needle+'\n'+textwrap.indent(textwrap.dedent(diagnostic).strip(), ' '*12))
          assert "assert 'SUMMARY_RETAINED_FACTS' in wire and not any(t.startswith('PRESSURE_1 ') for t in turns), name" in source
          path.write_text(source)
          print('FIFO_PROBE_SOURCE', os.environ['EXPECTED_SOURCE'], 'fixture_blob', blob)
          PY
      - name: Reproduce original assertions without retries
        run: scripts/run_tests.sh tests/gateway/test_journey_compress_restart_fifo.py -j 1 -v --tb=short
        env:
          HERMES_TEST_FILE_RETRIES: '0'
          HERMES_TEST_FILE_TIMEOUT: '180'
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''
