name: PR181 bounded runtime diagnostics

# Diagnostic-only branch. This workflow is not a PR qualification or a release lane.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr181-bounded-linux-diagnostics-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.repository == 'mrkillbob/hermes-agent' && github.ref == 'refs/heads/codex/diagnose-pr181-linux-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic head
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 2

      - name: Verify diagnostic ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "dd20ee6f00865a7d1afbb2a706bf8a13b315db9a"
          git diff --name-only HEAD^ HEAD

      - name: Set up the locked toolchain and test dependencies
        id: setup
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "messaging"]'
          test-environment: 'true'
          save-tools-cache: 'false'
          save-python-cache: 'false'
          save-node-cache: 'false'

      - name: Agent file with bounded per-case stacks and signal tracing
        run: |
          set -euo pipefail
          trap 'echo "DIAGNOSTIC_SIGTERM $(date -u +%FT%TZ) shell_pid=$$"; exit 143' TERM
          if command -v strace >/dev/null; then
            timeout --signal=TERM --kill-after=10 150 strace -f -qq -e trace=none -e signal=SIGTERM,SIGKILL scripts/run_tests.sh tests/agent/test_run_agent.py -vv -s
          else
            echo 'strace unavailable; per-case stack diagnostics remain enabled'
            timeout --signal=TERM --kill-after=10 150 scripts/run_tests.sh tests/agent/test_run_agent.py -vv -s
          fi
        env:
          HERMES_TEST_WORKERS: '1'
          HERMES_TEST_FILE_TIMEOUT: '90'
          HERMES_TEST_FILE_RETRIES: '0'
          OPENAI_API_KEY: ''
          OPENROUTER_API_KEY: ''
          NOUS_API_KEY: ''

      - name: Parity with the three overlapping lifecycle files
        if: always() && steps.setup.outcome == 'success'
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10 400 scripts/run_tests.sh --files 'tests/e2e/core/mcp_plugins/test_plugin_activation.py:tests/e2e/core/parity/test_boot_contract.py:tests/e2e/core/parity/test_entrypoint_parity.py:tests/e2e/core/parity/test_mcp_lifecycle.py' -vv
        env:
          HERMES_TEST_WORKERS: '3'
          HERMES_TEST_FILE_TIMEOUT: '300'
          HERMES_TEST_FILE_RETRIES: '0'
          OPENAI_API_KEY: ''
          OPENROUTER_API_KEY: ''
          NOUS_API_KEY: ''

      - name: Report fixture-only parity observations
        if: always() && steps.setup.outcome == 'success'
        run: |
          if test -f ci-diagnostics/parity-observations.json; then
            cat ci-diagnostics/parity-observations.json
          else
            echo 'No complete parity observation artifact was returned'
          fi
