name: Sync source qualification (not PR CI)

# Temporary dispatch-only source preparation harness. Restore the reviewed CI
# orchestrator before opening the sync PR; this is not a required-check result.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task22-sync-source-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Prepare source artifacts on standard Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout the exact preparation commit
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false

      - name: Record immutable input
        run: |
          mkdir -p "$RUNNER_TEMP/task22-source"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/task22-source/input.txt"
          git status --porcelain >> "$RUNNER_TEMP/task22-source/input.txt"
          sha256sum pyproject.toml uv.lock pm/pyproject.toml pm/uv.lock pm/lock.json > "$RUNNER_TEMP/task22-source/before-lock-hashes.txt"

      - name: Realize pinned tools through governed PM on the ephemeral runner
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          save-tools-cache: 'false'
          save-python-cache: 'false'
          save-node-cache: 'false'

      - name: Record selected tool versions and refresh npm lock metadata only
        run: |
          set -euo pipefail
          { python --version; node --version; npm --version; sha256sum pm/lock.json; } > "$RUNNER_TEMP/task22-source/tool-versions.txt"
          for project in . website scripts/whatsapp-bridge plugins/platforms/photon/sidecar; do
            (cd "$project" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
            destination="$RUNNER_TEMP/task22-source/npm-locks/$project"
            mkdir -p "$destination"
            cp "$project/package-lock.json" "$destination/package-lock.json"
            (cd "$project" && npm audit --package-lock-only --audit-level=high --json) > "$destination/audit.json"
          done
          git diff -- '**/package-lock.json' package-lock.json > "$RUNNER_TEMP/task22-source/npm-locks.diff"
          if find . -type d -name node_modules -print -quit | grep -q .; then
            echo 'Metadata-only npm step unexpectedly produced node_modules' >&2
            exit 1
          fi

      - name: Resolve and check source locks without upgrading
        run: |
          set -euo pipefail
          python -m pm.build_env --source pm --lock-only
          python -m pm.build_env --source pm --check-lock
          python -m pm.build_env --source . --lock-only
          python -m pm.build_env --source . --check-lock
          cp uv.lock "$RUNNER_TEMP/task22-source/uv.lock"
          cp pm/uv.lock "$RUNNER_TEMP/task22-source/pm-uv.lock"
          git diff -- pyproject.toml uv.lock pm/pyproject.toml pm/uv.lock > "$RUNNER_TEMP/task22-source/lock.diff"
          sha256sum pyproject.toml uv.lock pm/pyproject.toml pm/uv.lock pm/lock.json > "$RUNNER_TEMP/task22-source/after-lock-hashes.txt"

      - name: Prepare isolated locked test dependencies for rendering
        uses: ./.github/actions/setup-pm
        with:
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web"]'
          test-environment: 'true'
          save-tools-cache: 'false'
          save-python-cache: 'false'
          save-node-cache: 'false'

      - name: Prove bundled SDK selection and check repaired cleanup and prompts
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/task22-pyproject-candidate.toml"
          cp pyproject.toml "$candidate"
          trap 'cp "$candidate" pyproject.toml' EXIT
          git show 103247be1b6495bb345a115e7441731c6893397b:pyproject.toml > pyproject.toml
          set +e
          env -u __HERMES_ACTIVATED __HERMES_TESTS_REEXEC=1 PYTHONDONTWRITEBYTECODE=1 \
            HERMES_TEST_SCRATCH_ROOT="$RUNNER_TEMP/task22-test-scratch" \
            bash scripts/run_tests.sh -j1 --file-timeout 30 --file-retries 0 \
            tests/pm/test_sync_langfuse_selection.py \
            2>&1 | tee "$RUNNER_TEMP/task22-source/Langfuse-selection-baseline-red.log"
          red_rc=${PIPESTATUS[0]}
          set -e
          cp "$candidate" pyproject.toml
          trap - EXIT
          test "$red_rc" -eq 1
          grep -F "AssertionError: Bundled Langfuse extra is not selectable" \
            "$RUNNER_TEMP/task22-source/Langfuse-selection-baseline-red.log"
          env -u __HERMES_ACTIVATED __HERMES_TESTS_REEXEC=1 PYTHONDONTWRITEBYTECODE=1 \
            HERMES_TEST_SCRATCH_ROOT="$RUNNER_TEMP/task22-test-scratch" \
            bash scripts/run_tests.sh -j1 --file-timeout 30 --file-retries 0 \
            tests/tools/test_sync_delegation_profile_cleanup.py \
            tests/pm/test_sync_langfuse_selection.py \
            tests/plugins/test_langfuse_plugin.py::TestRuntimeGate \
            tests/ci/test_prompt_surface.py \
            tests/test_packaging_metadata.py \
            2>&1 | tee "$RUNNER_TEMP/task22-source/focused-candidate.log"

      - name: Render prompt fixtures with network blocked and fresh state
        run: |
          set -euo pipefail
          scratch="$(mktemp -d "$RUNNER_TEMP/task22-prompt.XXXXXX")"
          mkdir -p "$scratch/home" "$scratch/runtime" "$scratch/tmp"
          env -i PATH="$PATH" HOME="$scratch/home" HERMES_HOME="$scratch/home/.hermes" \
            HERMES_RUNTIME_DIR="$scratch/runtime" TMPDIR="$scratch/tmp" TZ=UTC LANG=C.UTF-8 \
            PYTHONPATH="$GITHUB_WORKSPACE" PYTHONHASHSEED=0 PYTHONDONTWRITEBYTECODE=1 \
            HERMES_DISABLE_LAZY_INSTALLS=1 \
            timeout 120 "$HERMES_PYTHON" scripts/ci/prompt_surface.py _child "$RUNNER_TEMP/task22-source/prompt_surface"
          python scripts/ci/prompt_surface.py diff tests/fixtures/prompt_surface \
            "$RUNNER_TEMP/task22-source/prompt_surface" --output "$RUNNER_TEMP/task22-source/prompt.diff.md"

      - name: Run pinned static checks against the frozen wave parent
        run: |
          set -euo pipefail
          python - <<'PYTHON' >> "$RUNNER_TEMP/task22-source/tool-versions.txt"
          from importlib.metadata import version
          from pm._uv import _toolchain
          print("ruff", version("ruff"))
          print("verified PM toolchain", _toolchain(realize=False))
          PYTHON
          python scripts/check --base 5ce1ad7f0d244eb3f44b9cb2bd49b891e971b87e 2>&1 | tee "$RUNNER_TEMP/task22-source/static.log"

      - name: Capture final source state
        if: always()
        run: |
          git diff --stat > "$RUNNER_TEMP/task22-source/final-stat.txt"
          git diff --check > "$RUNNER_TEMP/task22-source/whitespace.txt"

      - name: Upload only source artifacts and qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task22-sync-source-qualification
          path: ${{ runner.temp }}/task22-source/
          retention-days: 3
          if-no-files-found: error
