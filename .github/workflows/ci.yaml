name: CI428 focused FIFO diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fifo:
    name: Exact ${{ matrix.case }} FIFO qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: base-5db2
            commit: 5db2ba58cca697c2c90ea995fc0012f197ce6166
          - case: candidate-c6a6
            commit: c6a644bd4c3fd9412c4cc755bb22b05a8e524db0
    steps:
      - name: Checkout exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - name: Set up locked Python and isolated test dependencies
        uses: ./.github/actions/setup-pm
        with:
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain"]'
          test-environment: 'true'
          save-tools-cache: 'false'
          save-python-cache: 'false'
          prune-python-cache: true
      - name: Verify fixture identity and add bounded synthetic diagnostics
        env:
          EXPECTED_SOURCE: ${{ matrix.commit }}
        run: |
          "$HERMES_PYTHON" -B - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import subprocess

          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['EXPECTED_SOURCE']
          path = Path('tests/gateway/test_journey_compress_restart_fifo.py')
          data = path.read_bytes()
          blob = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert blob == '203d784e02a0bfb91a53318d6ca5904c04c9c3d6', blob

          fixed = data
          fixed_blob = blob
          needle = "            before['compacted'] = transcript(before['child'])"
          diagnostic = '''
                      from agent.context_compressor import _estimate_msg_budget_tokens
                      from agent.context_compressor_tail import lean_tail_budget
                      original_rows = rows('SELECT role,content FROM messages WHERE session_id=? ORDER BY id', (sid,))
                      print('FIFO_PRECONDITION', json.dumps({
                          'root_roles_sizes_tokens': [(r['role'], len(str(r['content'])), _estimate_msg_budget_tokens(r)) for r in original_rows],
                          'configured_lean_tail_budget': lean_tail_budget(64000, 12000),
                          'tail_case': tail_case, 'compacting_input': compacting['input_id'],
                          'child_pressure_markers': [f'PRESSURE_{i}' for i in range(12) if any(
                              str(c).startswith(f'PRESSURE_{i} ') for _, role, c in before['compacted'] if role == 'user')],
                          'child_roles_and_sizes': [(role, len(str(c))) for _, role, c in before['compacted']],
                          'summary_calls': sum(r['model'] == 'summary' for r in peer.requests),
                          'summary_input_pressure_markers': [f'PRESSURE_{i}' for i in range(12) if any(
                              f'PRESSURE_{i} ' in r['wire'] for r in peer.requests if r['model'] == 'summary')],
                      }, sort_keys=True), flush=True)
          '''
          # Only diagnostics change; the failing retention assertion stays byte-identical.
          import textwrap
          source = fixed.decode()
          assert source.count(needle) == 1
          source = source.replace(needle, needle+'\n'+textwrap.indent(textwrap.dedent(diagnostic).strip(), ' '*12))
          assert "assert 'SUMMARY_RETAINED_FACTS' in wire and not any(t.startswith('PRESSURE_1 ') for t in turns), name" in source
          path.write_text(source)
          print('FIFO_QUALIFIED_SOURCE', os.environ['EXPECTED_SOURCE'], 'original_fixture_blob', blob, 'fixed_fixture_blob', fixed_blob)
          PY
      - name: Qualify all four Linux journeys without retries
        run: scripts/run_tests.sh tests/gateway/test_journey_compress_restart_fifo.py -j 1 -v --tb=short
        env:
          HERMES_TEST_FILE_RETRIES: '0'
          HERMES_TEST_FILE_TIMEOUT: '180'
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''
