name: PR181 bounded runtime diagnostics

# Diagnostic-only branch. This workflow is not a PR qualification or a release lane.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr181-bounded-linux-diagnostics-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.repository == 'mrkillbob/hermes-agent' && github.ref == 'refs/heads/codex/diagnose-pr181-linux-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic head
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 2

      - name: Verify diagnostic ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "b7d659555d4db527b875004d37793df0bede75d6"
          git diff --name-only HEAD^ HEAD

      - name: Set up the locked toolchain and test dependencies
        id: setup
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "messaging"]'
          test-environment: 'true'
          save-tools-cache: 'false'
          save-python-cache: 'false'
          save-node-cache: 'false'

      - name: Agent file with whole-test stacks and no syscall tracer
        run: |
          set -euo pipefail
          trap 'echo "DIAGNOSTIC_SIGTERM $(date -u +%FT%TZ) shell_pid=$$"; exit 143' TERM
          timeout --signal=TERM --kill-after=10 180 scripts/run_tests.sh tests/agent/test_run_agent.py -vv -s -o faulthandler_timeout=20
        env:
          HERMES_TEST_WORKERS: '1'
          HERMES_TEST_FILE_TIMEOUT: '120'
          HERMES_TEST_FILE_RETRIES: '0'
          OPENAI_API_KEY: ''
          OPENROUTER_API_KEY: ''
          NOUS_API_KEY: ''
