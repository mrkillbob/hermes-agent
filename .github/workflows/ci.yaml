name: Pinned merged68bbcd90 Mac delivery candidate

# Artifact-only preparation branch. This does not replace main's CI or publish a release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-native-artifact-68bbcd90a850f7b04166b5b06346246966ada37a
  cancel-in-progress: false

jobs:
  mac-candidate:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      TARGET_COMMIT: 68bbcd90a850f7b04166b5b06346246966ada37a
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      HERMES_BUNDLE_ENV_JSON: '{}'
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: 68bbcd90a850f7b04166b5b06346246966ada37a
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and native host before preparation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "0680aaf8c2fe65f5a03612352d0d5f52bd1227d0"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          python3 -I -S -B - <<'PY'
          import shutil, sys
          assert sys.version_info >= (3, 11), sys.version
          free = shutil.disk_usage('.').free
          assert free >= 20 * 1024**3, f'Insufficient ephemeral build space: {free}'
          print('Bootstrap:', sys.version, 'free bytes:', free)
          PY
          # The accepted nested signer can inspect the disposable runner keychain.
          # Fail before building if it contains a signing identity; none is imported.
          security find-identity -v -p codesigning > "$RUNNER_TEMP/signing-identities.txt"
          grep -F '0 valid identities found' "$RUNNER_TEMP/signing-identities.txt"

      - name: Build the exact bundled candidate without release credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/delivery-evidence"
          # The supported local driver unsets signing/notary credentials and disables
          # outer identity discovery. Its nested signer may recheck the empty hosted
          # keychain. Keep the accepted custom signer and default supported policy;
          # strict validation below determines whether a signed candidate exists.
          bash scripts/build-bundle.sh --variant bundled -- --publish never \
            2>&1 | tee "$RUNNER_TEMP/delivery-evidence/build.log"

      - name: Seal only the disposable artifact with the accepted local signer
        shell: bash
        run: |
          set -euo pipefail
          # No app launch, install, credentials or product-source changes.
          cat > "$RUNNER_TEMP/seal_mac_artifact.py" <<'ARTIFACT_ADAPTER'
          """Artifact-only adapter for the pinned source's existing local signer.
          
          Only a disposable hosted build output is a supported caller. This never launches
          the app, imports Hermes configuration, selects credentials or installs anything.
          """
          import ast
          import hashlib
          import json
          import os
          from pathlib import Path
          import plistlib
          import shutil
          import subprocess
          from typing import Optional
          
          run = subprocess.run
          INPUTS = {
              "hermes_cli/main_desktop.py": "733b6189936245775485bae05b70c2dd67b1b3a7d0f274a1304b18858636202f",
              "apps/desktop/electron/entitlements.mac.plist": "edd08f7902e28a4c99832bdfc10ce1c89a56c10d09a79630ee950c4ca7950716",
              "apps/desktop/electron/entitlements.mac.inherit.plist": "599fc23e7c84738aaee58080755b64a9ee79611fa501959c2cbeb2421de18399",
          }
          
          
          def sha(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()
          
          
          def load_pinned_signer(repo: Path):
              for relative, expected in INPUTS.items():
                  path = repo / relative
                  if not path.is_file() or sha(path) != expected:
                      raise ValueError(f"signer source changed: {relative}")
              path = repo / "hermes_cli/main_desktop.py"
              names = {"_desktop_macos_bundle_id", "_codesign_verify", "_desktop_macos_local_codesign"}
              selected = [node for node in ast.parse(path.read_bytes()).body
                          if isinstance(node, ast.FunctionDef) and node.name in names]
              if {node.name for node in selected} != names:
                  raise ValueError("signer source functions missing")
              namespace = dict(Path=Path, Optional=Optional, os=os, shutil=shutil, subprocess=subprocess)
              exec(compile(ast.Module(body=selected, type_ignores=[]), str(path), "exec"), namespace)
              return namespace["_desktop_macos_local_codesign"]
          
          
          load_signer = load_pinned_signer
          
          
          def check_paths(repo: Path, app: Path) -> None:
              release = repo / "apps/desktop/release/mac-arm64"
              if app.parent != release or app.suffix != ".app" or not app.is_dir():
                  raise ValueError("app must belong to the owned release directory")
              if release.resolve() != release.absolute() or app.is_symlink():
                  raise ValueError("release must not alias another directory")
              for path in app.rglob("*"):
                  if path.is_symlink() and not path.resolve().is_relative_to(app.resolve()):
                      raise ValueError(f"artifact link escapes app: {path}")
                  if not path.is_symlink() and path.is_file() and path.stat().st_nlink != 1:
                      raise ValueError(f"artifact hardlink is not detached: {path}")
          
          
          def payload_snapshot(payload):
              return {str(p.relative_to(payload)): ("link", os.readlink(p)) if p.is_symlink()
                      else ("directory", p.stat().st_mode) if p.is_dir()
                      else ("file", p.stat().st_mode, sha(p)) for p in payload.rglob("*")}
          
          
          def seal_artifact(repo: Path, app: Path) -> dict:
              check_paths(repo, app)
              payload = app / "Contents/Resources/agent-payload"
              stamp = json.loads((app / "Contents/Resources/install-stamp.json").read_text())
              manifest = json.loads((payload / "manifest.json").read_text())
              target = "68bbcd90a850f7b04166b5b06346246966ada37a"
              if (stamp.get("commit") != target or stamp.get("dirty") is not False
                      or stamp.get("payload") != "bundled" or manifest.get("ref") != target
                      or manifest.get("target") != "darwin-arm64"):
                  raise ValueError("artifact source identity mismatch")
              prepared = json.loads((repo / ".build/desktop-job/prepared.json").read_text())
              python = Path(prepared["python"])
              if (prepared.get("schema") != 1 or not python.is_absolute() or not python.is_file()
                      or not python.resolve().is_relative_to(repo / ".cache/desktop-inputs/tools")):
                  raise ValueError("prepared interpreter escapes owned build tools")
              signer = load_signer(repo)
              info = run(["codesign", "-d", "--verbose=4", str(app)], capture_output=True, check=False)
              for line in (info.stdout + info.stderr).decode().splitlines():
                  if line.startswith("TeamIdentifier=") and line != "TeamIdentifier=not set":
                      raise ValueError("refusing publisher signature downgrade")
              if signer(app, desktop_dir=repo / "apps/desktop", identity="-") is not True:
                  raise ValueError("accepted local signer did not strictly verify")
              environment = {"PATH": "/usr/bin:/bin:/usr/sbin:/sbin", "HOME": str(repo / ".build/desktop-job/home"),
                             "HERMES_HOME": str(repo / ".build/desktop-job/hermes-home"),
                             "HERMES_RUNTIME_DIR": str(repo / ".cache/desktop-inputs/tools"),
                             "PYTHONDONTWRITEBYTECODE": "1", "PYTHONUTF8": "1"}
              run([str(python), "-I", "-S", "-B", str(repo / "scripts/bundles/payload.py"), "rehash", str(payload)],
                  cwd=repo, env=environment, check=True)
              snapshot = payload_snapshot(payload)
              entitlements = repo / "apps/desktop/electron/entitlements.mac.plist"
              identifier = plistlib.loads((app / "Contents/Info.plist").read_bytes())["CFBundleIdentifier"]
              run(["codesign", "--force", "--sign", "-", "--timestamp=none", "--options", "runtime",
                   "--entitlements", str(entitlements), "--requirements", f'=designated => identifier "{identifier}"',
                   str(app)], check=True, capture_output=True)
              if payload_snapshot(payload) != snapshot:
                  raise ValueError("payload changed during outer seal")
              run(["codesign", "--verify", "--deep", "--strict", "--verbose=2", str(app)], check=True, capture_output=True)
              signature = run(["codesign", "-d", "--verbose=4", str(app)], check=True, capture_output=True)
              signature_text = (signature.stdout + signature.stderr).decode()
              for expected in ("Signature=adhoc", "TeamIdentifier=not set", "runtime", f"Identifier={identifier}"):
                  if expected not in signature_text:
                      raise ValueError(f"final signature missing {expected}")
              if not (app / "Contents/_CodeSignature/CodeResources").is_file():
                  raise ValueError("final resource envelope missing")
              actual = run(["codesign", "-d", "--entitlements", ":-", str(app)], check=True, capture_output=True)
              if plistlib.loads(actual.stdout) != plistlib.loads(entitlements.read_bytes()):
                  raise ValueError("final main entitlements differ from accepted source")
              return {"strict_verified": True, "payload_unchanged_after_outer_seal": True,
                      "application_launched": False, "installed_on_user_host": False,
                      "signer_inputs_sha256": INPUTS, "signature": signature_text,
                      "payload_files_recorded": len(snapshot), "notarized": False}
          
          
          if __name__ == "__main__":
              if os.environ.get("GITHUB_ACTIONS") != "true":
                  raise SystemExit("artifact adapter is restricted to disposable hosted builds")
              repo = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
              if os.uname().sysname != "Darwin" or os.uname().machine != "arm64":
                  raise SystemExit("native ARM64 Mac required")
              head = subprocess.check_output(["git", "-C", str(repo), "rev-parse", "HEAD"], text=True).strip()
              if head != "68bbcd90a850f7b04166b5b06346246966ada37a":
                  raise SystemExit("final accepted source pin required")
              apps = list((repo / "apps/desktop/release/mac-arm64").glob("*.app"))
              if len(apps) != 1:
                  raise SystemExit("exactly one fresh app required")
              try:
                  receipt = seal_artifact(repo, apps[0])
              except subprocess.CalledProcessError as error:
                  # Existing helper captures codesign output. Preserve the actual failure
                  # without retrying, weakening verification or falling back to deep-sign.
                  print((error.stdout or b"").decode(errors="replace"))
                  print((error.stderr or b"").decode(errors="replace"))
                  raise
              evidence = Path(os.environ["RUNNER_TEMP"]) / "delivery-evidence"
              (evidence / "artifact-sealing.json").write_text(json.dumps(receipt, indent=2) + "\n")
          ARTIFACT_ADAPTER
          python3 -I -S -B "$RUNNER_TEMP/seal_mac_artifact.py"
          # Original builder outputs remain unverified and are never uploaded as candidates.
          mkdir -p apps/desktop/release/sealed-candidate
          app=(apps/desktop/release/mac-arm64/*.app)
          test "${#app[@]}" -eq 1
          ditto -c -k --keepParent --sequesterRsrc --zlibCompressionLevel 1 \
            "${app[0]}" apps/desktop/release/sealed-candidate/Hermes-68bbcd90-arm64-adhoc.zip

