name: Pinned Mac delivery candidate

# Artifact-only preparation branch. This does not replace main's CI or publish a release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-candidate:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      TARGET_COMMIT: 2a1fe483cc90096e174127af3a0db1ed8f95bb7d
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      HERMES_BUNDLE_ENV_JSON: '{}'
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: 2a1fe483cc90096e174127af3a0db1ed8f95bb7d
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and native host before preparation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          python3 -I -S -B - <<'PY'
          import shutil, sys
          assert sys.version_info >= (3, 11), sys.version
          free = shutil.disk_usage('.').free
          assert free >= 20 * 1024**3, f'Insufficient ephemeral build space: {free}'
          print('Bootstrap:', sys.version, 'free bytes:', free)
          PY
          # The accepted nested signer can inspect the disposable runner keychain.
          # Fail before building if it contains a signing identity; none is imported.
          security find-identity -v -p codesigning > "$RUNNER_TEMP/signing-identities.txt"
          grep -F '0 valid identities found' "$RUNNER_TEMP/signing-identities.txt"

      - name: Build the exact bundled candidate without release credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/delivery-evidence"
          # The supported local driver unsets signing/notary credentials and disables
          # outer identity discovery. Its nested signer may recheck the empty hosted
          # keychain. Keep the accepted custom signer and default supported policy;
          # strict validation below determines whether a signed candidate exists.
          bash scripts/build-bundle.sh --variant bundled -- --publish never \
            2>&1 | tee "$RUNNER_TEMP/delivery-evidence/build.log"

      - name: Verify the packaged app and record immutable delivery identity
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY'
          import hashlib, json, os, plistlib, subprocess, zipfile
          from pathlib import Path
          root = Path.cwd()
          evidence = Path(os.environ['RUNNER_TEMP']) / 'delivery-evidence'
          def command(*args):
              return subprocess.check_output(args, text=True, stderr=subprocess.STDOUT).strip()
          def digest(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()
          assert command('git', 'rev-parse', 'HEAD') == os.environ['TARGET_COMMIT']
          assert not command('git', 'status', '--porcelain', '--untracked-files=all')
          release = root / 'apps/desktop/release'
          apps = list(release.glob('mac-arm64/*.app'))
          assert len(apps) == 1, [str(p) for p in apps]
          app = apps[0]
          info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
          executable = app / 'Contents/MacOS' / info['CFBundleExecutable']
          assert os.access(executable, os.X_OK)
          architectures = command('lipo', '-archs', str(executable)).split()
          assert 'arm64' in architectures, architectures
          resources = app / 'Contents/Resources'
          stamp_file = resources / 'install-stamp.json'
          stamp = json.loads(stamp_file.read_text())
          assert stamp['schemaVersion'] == 1
          assert stamp['commit'] == os.environ['TARGET_COMMIT']
          assert stamp['dirty'] is False and stamp['source'] == 'commit-build'
          assert stamp['payload'] == 'bundled' and stamp['updateMechanism'] == 'external'
          assert stamp['distribution'] == 'desktop-app'
          assert (resources / 'app.asar').is_file()
          payload = resources / 'agent-payload'
          assert payload.is_dir() and (payload / 'manifest.json').is_file()
          manifest = json.loads((payload / 'manifest.json').read_text())
          assert manifest['schema'] == 1 and manifest['target'] == 'darwin-arm64'
          assert manifest['ref'] == os.environ['TARGET_COMMIT']
          runtime = stamp['runtime']
          assert runtime == manifest['runtime']
          for relative in (runtime['repoDir'], runtime['storePython'], *runtime['commands'].values()):
              selected = (payload / relative).resolve()
              assert selected.is_relative_to(payload.resolve()) and selected.exists(), relative
          python_architectures = command('lipo', '-archs', str(payload / runtime['storePython'])).split()
          assert 'arm64' in python_architectures, python_architectures
          embedded_stamp = payload / runtime['repoDir'] / 'install-stamp.json'
          assert json.loads(embedded_stamp.read_text()) == stamp
          verification = command('codesign', '--verify', '--deep', '--strict', '--verbose=2', str(app))
          signature = command('codesign', '-d', '--verbose=4', str(app))
          assert 'Signature=adhoc' in signature and 'Authority=' not in signature, signature
          (evidence / 'codesign-verification.txt').write_text(verification + '\n')
          (evidence / 'codesign-identity.txt').write_text(signature + '\n')
          artifacts = sorted(release.glob('*.zip'))
          assert len(artifacts) == 1, [str(p) for p in artifacts]
          with zipfile.ZipFile(artifacts[0]) as archive:
              assert archive.testzip() is None
              for relative in ('Contents/Resources/install-stamp.json',
                               'Contents/Resources/agent-payload/manifest.json'):
                  members = [p for p in archive.namelist() if p == app.name + '/' + relative]
                  assert len(members) == 1, members
                  assert archive.read(members[0]) == (app / relative).read_bytes()
          files = {str(p.relative_to(root)): {'bytes': p.stat().st_size, 'sha256': digest(p)}
                   for p in [*artifacts, stamp_file, resources / 'app.asar', payload / 'manifest.json',
                             root / 'pm/lock.json', root / 'uv.lock', root / 'package-lock.json']}
          receipt = {'schema': 1, 'source_commit': os.environ['TARGET_COMMIT'],
                     'source_tree': command('git', 'rev-parse', 'HEAD^{tree}'),
                     'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                     'host': command('sw_vers'), 'architectures': architectures,
                     'embedded_python_architectures': python_architectures,
                     'app': str(app.relative_to(root)), 'stamp': stamp, 'files': files,
                     'signing_class': 'ad-hoc', 'signing_credentials_used': False, 'notarized': False,
                     'signing_identity_lookup': 'empty disposable hosted-runner keychain',
                     'application_launched': False, 'installed_on_user_host': False,
                     'production_adoption_authorized': False}
          (evidence / 'candidate-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY

      - name: Upload installable archive and validation receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-arm64-candidate-2a1fe483-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/desktop/release/*.zip
            ${{ runner.temp }}/delivery-evidence/candidate-receipt.json
            ${{ runner.temp }}/delivery-evidence/codesign-*.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-candidate-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/delivery-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Record unverified package identity after a failure
        if: ${{ failure() && !cancelled() }}
        shell: bash
        run: |
          python3 -I -S -B - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          rows = []
          for path in sorted(Path('apps/desktop/release').glob('*.zip')):
              with path.open('rb') as stream:
                  sha = hashlib.file_digest(stream, 'sha256').hexdigest()
              rows.append({'path': str(path), 'bytes': path.stat().st_size, 'sha256': sha})
          output = Path(os.environ['RUNNER_TEMP']) / 'unverified-artifact-receipt.json'
          signatures = []
          for app in Path('apps/desktop/release').glob('mac-arm64/*.app'):
              for arguments in (['--verify', '--deep', '--strict', '--verbose=2'], ['-d', '--verbose=4']):
                  result = subprocess.run(['codesign', *arguments, str(app)], capture_output=True, text=True, check=False)
                  signatures.append({'app': str(app), 'arguments': arguments, 'exit_code': result.returncode,
                                     'stdout': result.stdout, 'stderr': result.stderr})
          output.write_text(json.dumps({'source_commit': os.environ['TARGET_COMMIT'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'verified': False, 'installation_authorized': False, 'files': rows,
              'signature_diagnostics': signatures}, indent=2) + '\n')
          PY

      - name: Quarantine unverified archive after a failure
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UNVERIFIED-mac-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/desktop/release/*.zip
            ${{ runner.temp }}/unverified-artifact-receipt.json
          if-no-files-found: warn
          retention-days: 14
