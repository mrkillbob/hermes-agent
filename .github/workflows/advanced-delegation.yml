name: Advanced Delegation 1.1.0

on:
  pull_request:
  push:
    branches: [ mrkillbob-advanced-delegation-routing-1-1-0 ]

jobs:
  advanced-delegation-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Unit tests (advanced routing + budget cap)
        run: pytest -q tests/tools/test_delegation_advanced_routing.py tests/tools/test_delegate_summary_budget_cap_enforced_small.py
      - name: Run representative benchmark
        run: |
          python evals/advanced_routing/bench.py
      - name: Verify grants mock (non-secret)
        run: |
          mkdir -p artifacts
          python evals/advanced_routing/mock_grant_check.py > artifacts/mock_grant_check.json
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: advanced-delegation-bench
          path: artifacts
          retention-days: 14
