name: Portable reconciliation qualification
on:
  push:
    branches: [codex/portable-pr97370-lifecycle-qualification-20261009]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen source and dependency manifest
        run: python3 .ci/portable-reconcile/verify_source.py
      - name: Set up exact locked PM test environment
        uses: ./.github/actions/setup-pm
        with:
          test-environment: 'true'
          cache-suffix: pr97370-v14-portable
          save-tools-cache: 'false'
          save-python-cache: 'false'
      - name: Qualify remaining inherited fallback and privacy topic files
        run: |
          set -o pipefail
          scripts/run_tests.sh -j 1 --file-retries 0 tests/agent/test_auxiliary_auth_rung_fallthrough.py tests/agent/test_auxiliary_auto_never_guesses_provider.py tests/agent/test_auxiliary_client.py tests/agent/test_auxiliary_error_classification.py tests/agent/test_auxiliary_fallback_multihop.py tests/agent/test_auxiliary_main_first.py tests/agent/test_auxiliary_reasoning_field_rejection_retry.py tests/agent/test_auxiliary_title_timeout_bound.py tests/agent/test_codex_aux_no_progress_timeout.py tests/agent/test_codex_request_transport_diagnostics.py tests/agent/test_coding_context.py tests/agent/test_fallback_api_mode_preservation.py tests/agent/test_kanban_stop.py tests/agent/test_llm_egress_firewall.py tests/agent/test_provider_fallback.py tests/agent/test_run_agent.py tests/agent/test_system_prompt.py tests/hermes_cli/test_kanban_db.py tests/hermes_cli/test_remote_kanban_private_work.py tests/tools/test_file_tools_source_provenance.py tests/tools/test_kanban_tools.py tests/tools/test_terminal_foreground_timeout_cap.py | tee portable-focused.log
      - name: Verify source remained frozen
        if: always()
        run: python3 .ci/portable-reconcile/verify_source.py
      - name: Preserve qualification output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reconciliation-inherited
          path: |
            portable-focused.log
            portable-static.log
