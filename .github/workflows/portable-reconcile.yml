name: Portable reconciliation qualification
on:
  push:
    branches: [codex/portable-pr97370-lifecycle-qualification-20261009]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen source and dependency manifest
        run: python3 .ci/portable-reconcile/verify_source.py
      - name: Set up exact locked PM test environment
        uses: ./.github/actions/setup-pm
        with:
          test-environment: 'true'
          cache-suffix: pr97370-v14-portable
          save-tools-cache: 'false'
          save-python-cache: 'false'
      - name: Qualify reviewed source integrity and affected lifecycle consumers
        run: |
          set -o pipefail
          scripts/run_tests.sh -j 1 --file-retries 0 tests/tools/test_kanban_tools.py | tee portable-focused.log
      - name: Run eleven required static checks against observed upstream main
        if: always()
        run: |
          set -o pipefail
          python scripts/check --base 8bff64d6ed3414a66976bfa8ab72c14b6bca2a6f | tee portable-static.log
      - name: Verify source remained frozen
        if: always()
        run: python3 .ci/portable-reconcile/verify_source.py
      - name: Preserve qualification output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reconciliation-boundary-targeted
          path: |
            portable-focused.log
            portable-static.log
