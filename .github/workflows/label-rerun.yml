name: Label rerun

# A pull_request event uses candidate workflow code. This file only wakes the
# default-branch Review CI resumption controller, which reads live maintainer
# labels and exact-head run metadata before requesting any retry.
on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  wake-up:
    if: >-
      github.repository == 'mrkillbob/hermes-agent' &&
      contains(fromJSON('["run-e2e", "ci-reviewed"]'), github.event.label.name)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake trusted label reconciliation
        run: echo 'Maintainer labels changed; the trusted controller will re-evaluate them.'
