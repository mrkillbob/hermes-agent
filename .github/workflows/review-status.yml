name: Current review status

# These events load workflow code from the default branch. Candidate workflow
# files, actions, artifacts and source never participate in this publisher.
on:
  push:
    branches: [main]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Review CI wake-up, Review CI resumption, CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  discover:
    if: >-
      github.repository == 'mrkillbob/hermes-agent' &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request &&
        (github.event.comment.user.id == 199175422 ||
         contains(github.event.comment.body, '@codex')))) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Checkout the immutable trusted event revision
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: false
      - name: Select bounded distinct open PR heads
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_REPO: ${{ github.repository }}
        run: python3 -m scripts.ci.review_status --repo "$REVIEW_REPO" --discover

  publish:
    needs: discover
    if: >-
      needs.discover.outputs.matrix != '' &&
      needs.discover.outputs.matrix != '{"include": []}'
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      checks: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    # A check is commit-scoped; all PRs sharing its head are one decision.
    concurrency:
      group: review-status-${{ github.repository }}-${{ matrix.head }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the immutable trusted event revision
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: false
      - name: Publish the complete live shared-head review verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_REPO: ${{ github.repository }}
          REVIEW_HEAD: ${{ matrix.head }}
        run: python3 -m scripts.ci.review_status --repo "$REVIEW_REPO" --head "$REVIEW_HEAD"
