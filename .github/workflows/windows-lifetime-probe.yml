name: Windows lifetime identity probe

on:
  push:
    branches: [codex/windows-lifetime-identity-20261024]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: legacy
        with:
          python-version: '3.11.9'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: worker
        with:
          python-version: '3.14.7'
      - name: Probe unchanged source with both real interpreters
        shell: pwsh
        env:
          LEGACY_PYTHON: ${{ steps.legacy.outputs.python-path }}
          WORKER_PYTHON: ${{ steps.worker.outputs.python-path }}
        run: |
          & $env:WORKER_PYTHON -I -S -B scripts/ci/probe_windows_lifetime.py --legacy $env:LEGACY_PYTHON --worker $env:WORKER_PYTHON
          exit $LASTEXITCODE
