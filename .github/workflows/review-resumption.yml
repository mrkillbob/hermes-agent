name: Review CI resumption

# workflow_run and schedule load this workflow from the default branch. Never
# add PR checkout, PR actions, downloaded executable artifacts, or inherited secrets.
on:
  # issue_comment also loads the default-branch workflow. Canonical activity
  # summaries are created/edited even when a clean pass submits no review.
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows:
      - Review CI wake-up
      - CI
      - Docker Build, Test, and Publish
      - Nix flake check
    types: [completed]
  # GitHub Actions has no pull_request_review_thread trigger. This bounded
  # metadata-only pass covers resolutions and missed/empty native associations.
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  discover:
    if: >-
      github.repository == 'mrkillbob/hermes-agent' &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request && github.event.comment.user.id == 199175422))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: false
      - name: Select bounded PR identities
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_REPO: ${{ github.repository }}
        run: python3 -m scripts.ci.review_resumption --repo "$REVIEW_REPO" --discover

  resume:
    needs: discover
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: write
    if: >-
      needs.discover.outputs.matrix != '' && needs.discover.outputs.matrix != '{"include": []}'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    # Serialize only this PR's writers. A different PR never waits on its CI.
    concurrency:
      group: review-ci-resume-${{ github.repository }}-${{ matrix.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: false
      - name: Re-evaluate exact-head review and request eligible retries
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_REPO: ${{ github.repository }}
          REVIEW_PR: ${{ matrix.number }}
          REVIEW_HEAD: ${{ matrix.head }}
        run: >-
          python3 -m scripts.ci.review_resumption --repo "$REVIEW_REPO"
          --pr "$REVIEW_PR" --head "$REVIEW_HEAD"
