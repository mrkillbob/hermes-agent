# Temporary candidate qualification; remove before updating PR204.
name: Ordinary sync validation

on:
  push:
    branches: ['ordinary-sync/**']

permissions:
  contents: read

concurrency:
  group: ordinary-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: ./.github/workflows/tests.yml
    with:
      slice_count: 24
      e2e: false
      e2e_upgrade: false

  native:
    uses: ./.github/workflows/tests-os.yml
    with:
      platform_scope: all
      desktop_updater: true
      e2e: false
      e2e_upgrade: false

  javascript:
    uses: ./.github/workflows/js-tests.yml

  source-checks:
    uses: ./.github/workflows/lint.yml
    with:
      event_name: push
      python: true

  code-health:
    name: Code health against the fork base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the immutable fork base
        run: git fetch --no-tags --depth=1 origin 23ed0acc3f8e9d72c67c663dcefc642ca5682c59
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          cache-python: true
          prune-python-cache: true
      - name: Install pinned ruff
        uses: ./.github/actions/retry
        with:
          command: python -m scripts.ci.python_packages "$(python -m scripts.code_health --print-pins)"
      - name: Ratchet the candidate against the immutable fork base
        run: python scripts/check --only health --base 23ed0acc3f8e9d72c67c663dcefc642ca5682c59

  windows-installer:
    uses: ./.github/workflows/install-e2e-windows-run.yml
    with:
      install-method: desktop-installer@latest
      update-method: hermes-desktop-app-update
      install-ref: HEAD
      update-ref: NEXT
      tag-has-desktop: true
      leg-id: ordinary-sync-windows-gui-head-next

  macos-installer:
    uses: ./.github/workflows/install-e2e-macos-run.yml
    with:
      install-method: desktop-installer@latest
      update-method: hermes-desktop-app-update
      install-ref: HEAD
      update-ref: NEXT
      tag-has-desktop: true
      leg-id: ordinary-sync-macos-gui-head-next
