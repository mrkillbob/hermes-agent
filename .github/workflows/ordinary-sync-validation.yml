# Temporary logger requalification after the full e63e368 run; remove before PR204.
name: Ordinary sync validation

on:
  push:
    branches: ['ordinary-sync/**']

permissions:
  contents: read

concurrency:
  group: ordinary-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oauth:
    name: Auxiliary OAuth and provider contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - name: Set up canonical locked test dependencies
        uses: ./.github/actions/setup-pm
        with:
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web"]'
          test-environment: 'true'
          archive-inputs: 'false'
          prune-python-cache: true
      - name: Exercise the auxiliary provider and OAuth paths
        run: >-
          scripts/run_tests.sh
          tests/agent/test_auxiliary_plugin_oauth.py
          tests/agent/test_auxiliary_provider_supplied_client.py
          tests/agent/test_anthropic_third_party_oauth_guard.py
          tests/agent/test_auxiliary_client.py
        env:
          HERMES_TEST_WORKERS: '2'
          HERMES_TEST_FILE_TIMEOUT: '600'
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''

  source-checks:
    uses: ./.github/workflows/lint.yml
    with:
      event_name: push
      python: true

  code-health:
    name: Code health against the fork base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the immutable fork base
        run: git fetch --no-tags --depth=1 origin 23ed0acc3f8e9d72c67c663dcefc642ca5682c59
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          cache-python: true
          prune-python-cache: true
      - name: Install pinned ruff
        uses: ./.github/actions/retry
        with:
          command: python -m scripts.ci.python_packages "$(python -m scripts.code_health --print-pins)"
      - name: Ratchet the candidate against the immutable fork base
        run: python scripts/check --only health --base 23ed0acc3f8e9d72c67c663dcefc642ca5682c59
