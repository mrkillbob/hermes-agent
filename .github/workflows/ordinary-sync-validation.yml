# Temporary handoff observation qualification; remove before PR204 update.
name: Ordinary sync validation

on:
  push:
    branches: ['ordinary-sync/**']

permissions:
  contents: read

jobs:
  handoff-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - name: Set up locked test environment
        uses: ./.github/actions/setup-pm
        with:
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web"]'
          test-environment: 'true'
          archive-inputs: 'false'
          prune-python-cache: true
      - name: Check the cron observation contract
        run: scripts/run_tests.sh tests/e2e/core/upgrade/handoff/test_cron_observation.py
        env:
          HERMES_TEST_WORKERS: '1'
          HERMES_TEST_FILE_TIMEOUT: '600'
